version: '3.8'

services:
  redis:
    image: redis:7.2-alpine
    container_name: redis-cache
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "notice"]
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 64M
    ports:
      - "6379:6379"

volumes:
  redis_data: